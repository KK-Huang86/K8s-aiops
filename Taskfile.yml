version: '3'

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig.yaml"

tasks:
  default:
    desc: "互動選單"
    cmds:
      - |
        choice=$(gum choose \
          "apply           - 建立 LKE cluster" \
          "destroy         - 刪除 LKE cluster" \
          "nodes           - 查看 cluster nodes" \
          "pods            - 查看所有 pods" \
          "info            - 查看 cluster 資訊" \
          "grafana-ip      - 查看 Grafana 外部 IP" \
          "keep-url        - 查看 Keep UI 網址" \
          "keep-status     - 查看 Keep pods 狀態" \
          "keep-logs       - 查看 Keep backend log" \
          "traffic-start   - 啟動 CPU 壓力測試" \
          "traffic-stop    - 停止 CPU 壓力測試" \
          "traffic-logs    - 查看壓力測試 log" \
          "traffic-status  - 查看壓力測試狀態")
        task $(echo $choice | awk '{print $1}')

  apply:
    desc: "建立 LKE cluster"
    cmds:
      - terraform apply

  destroy:
    desc: "刪除 LKE cluster"
    cmds:
      - terraform destroy

  nodes:
    desc: "查看 cluster nodes"
    cmds:
      - kubectl get nodes

  pods:
    desc: "查看所有 pods"
    cmds:
      - kubectl get pods -A

  info:
    desc: "查看 cluster 資訊"
    cmds:
      - kubectl cluster-info

  grafana-ip:
    desc: "查看 Grafana 外部 IP"
    cmds:
      - kubectl get svc grafana -n monitoring

  keep-url:
    desc: "查看 Keep UI 網址"
    cmds:
      - |
        IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Keep UI: http://${IP}.nip.io"

  keep-status:
    desc: "查看 Keep pods 狀態"
    cmds:
      - kubectl get pods -n keep

  keep-logs:
    desc: "查看 Keep backend log"
    cmds:
      - kubectl logs -f -l app.kubernetes.io/name=keep-backend -n keep --tail=50

  traffic-start:
    desc: "啟動 CPU 壓力測試"
    cmds:
      - kubectl delete job cpu-stress -n traffic-sim --ignore-not-found
      - terraform apply -target=kubernetes_namespace.traffic_sim -target=kubernetes_job.cpu_stress -auto-approve
      - echo "CPU 壓力測試已啟動，使用 'task traffic-logs' 查看 log"

  traffic-stop:
    desc: "停止 CPU 壓力測試"
    cmds:
      - kubectl delete job cpu-stress -n traffic-sim --ignore-not-found
      - echo "CPU 壓力測試已停止"

  traffic-logs:
    desc: "查看 CPU 壓力測試 log"
    cmds:
      - kubectl logs -f -l app=cpu-stress -n traffic-sim

  traffic-status:
    desc: "查看 CPU 壓力測試狀態"
    cmds:
      - kubectl get pods -n traffic-sim
      - kubectl top nodes
